es",title:"L\xE9gislatives 2024 : quelles propositions en mati\xE8re d'immigration ? Tour d'horizon des programmes",publisher:"LCP \u2014 Assembl\xE9e nationale",type:"press",date:"2024-06-21",quote:"Le PS, les \xC9cologistes et les autres partis de gauche veulent abroger les lois immigration de 2018 et 2023, r\xE9gulariser les travailleurs, les \xE9tudiants et les parents d'enfants scolaris\xE9s, et faire de la carte de s\xE9jour de dix ans le titre de droit commun.",verified:!1},nfpInfomigrants:{url:"https://www.infomigrants.net/fr/post/58284/immigration--le-nouveau-front-populaire-mise-sur-moins-de-repression-et-plus-daccompagnement-des-etrangers",title:"Immigration : le Nouveau Front populaire mise sur moins de r\xE9pression et plus d'accompagnement des \xE9trangers",publisher:"InfoMigrants",type:"press",date:"2024-06-24",quote:"Le programme pr\xE9voit la r\xE9gularisation des travailleurs sans-papiers, l'accueil inconditionnel des mineurs non accompagn\xE9s et l'abrogation des dispositions les plus restrictives de la loi de 2024.",verified:!1},lfiElysee:{url:"https://www.elyseescope.com/candidat/jean-luc-melenchon/immigration",title:"Que propose Jean-Luc M\xE9lenchon sur l'immigration ?",publisher:"\xC9lys\xE9eScope",type:"press",date:"2026-06-01",quote:"R\xE9gularisation des sans-papiers, droit de vote des \xE9trangers aux \xE9lections locales, accueil inconditionnel des mineurs non accompagn\xE9s et abrogation des lois restrictives.",verified:!1},lfiRegul:{url:"https://lcp.fr/actualites/regularisation-des-travailleurs-sans-papiers-l-amendement-de-compromis-de-la-majorite",title:"R\xE9gularisation des travailleurs sans-papiers : l'amendement de \xAB compromis \xBB de la majorit\xE9 adopt\xE9 en commission",publisher:"LCP \u2014 Assembl\xE9e nationale",type:"vote",date:"2023-11-28",quote:"Les d\xE9put\xE9s LFI ont d\xE9nonc\xE9 le c\xF4t\xE9 \xAB utilitariste \xBB du dispositif et r\xE9affirm\xE9 leur volont\xE9 de \xAB r\xE9gulariser tous les travailleurs sans-papiers pr\xE9sents sur le territoire \xBB.",verified:!1},metiersTension:{url:"https://www.publicsenat.fr/actualites/parlementaire/immigration-la-gauche-et-des-elus-macronistes-mettent-la-pression-pour-defendre-les-regularisations-dans-les-metiers-en-tension",title:"Immigration : la gauche et des \xE9lus macronistes mettent la pression pour d\xE9fendre les r\xE9gularisations dans les m\xE9tiers en tension",publisher:"Public S\xE9nat",type:"vote",date:"2023-12-06",quote:"Socialistes, \xE9cologistes et communistes ont d\xE9fendu la cr\xE9ation d'un titre de s\xE9jour pour les travailleurs des m\xE9tiers en tension et la pr\xE9servation de l'article 4 ouvrant le march\xE9 du travail aux demandeurs d'asile.",verified:!1},compromisFranceinfo:{url:"https://www.franceinfo.fr/politique/parlement-francais/assemblee-nationale/les-deputes-votent-en-commission-un-compromis-sur-la-regularisation-des-sans-papiers-dans-les-metiers-en-tension_6215445.html",title:"Les d\xE9put\xE9s votent en commission un compromis sur la r\xE9gularisation des sans-papiers dans les m\xE9tiers en tension",publisher:"franceinfo",type:"vote",date:"2023-11-28",quote:"Le compromis de la majorit\xE9 ouvre une r\xE9gularisation encadr\xE9e, \xE0 la main du pr\xE9fet, pour les travailleurs des m\xE9tiers en tension, sans cr\xE9er de droit automatique.",verified:!1},philippeProgramme:{url:"https://monvote2027.fr/candidat/philippe",title:"\xC9douard Philippe \u2014 Programme et positions",publisher:"MonVote2027",type:"press",date:"2026-05-01",quote:"\xC9douard Philippe d\xE9fend une immigration de travail assum\xE9e, avec des quotas de r\xE9gularisation dans les m\xE9tiers en tension, en rupture avec l'immigration familiale, et une ex\xE9cution plus syst\xE9matique des OQTF.",verified:!1},philippeQuotas:{url:"https://www.aljazeera.com/news/2019/10/france-prime-minister-signals-support-immigration-quotas-191008011749419.html",title:"France's prime minister signals support for immigration quotas",publisher:"Al Jazeera",type:"statement",date:"2019-10-08",quote:"\xC9douard Philippe, alors Premier ministre, s'est d\xE9clar\xE9 favorable \xE0 des quotas d'immigration \xE9conomique fix\xE9s en fonction des besoins du march\xE9 du travail.",verified:!1},zemmourZero:{url:"https://www.europe1.fr/politique/je-suis-pour-limmigration-zero-mais-aussi-pour-limmigration-negative-martele-eric-zemmour-958758",title:"\xAB Je suis pour l'immigration z\xE9ro mais aussi pour l'immigration n\xE9gative \xBB, mart\xE8le \xC9ric Zemmour",publisher:"Europe 1",type:"statement",date:"2021-09-01",quote:"\xAB Je suis pour l'immigration z\xE9ro mais aussi pour l'immigration n\xE9gative. \xBB",verified:!1},zemmourRemigration:{url:"https://www.lejdd.fr/Politique/le-debrief-presidentiel-zemmour-veut-un-ministere-de-la-remigration-roussel-sen-prend-aux-ecologistes-4101081",title:"Zemmour veut un \xAB minist\xE8re de la remigration \xBB",publisher:"Le JDD",type:"statement",date:"2022-03-01",quote:"\xC9ric Zemmour propose la cr\xE9ation d'un minist\xE8re de la \xAB remigration \xBB charg\xE9 d'expulser les \xE9trangers condamn\xE9s, les fich\xE9s S et les extra-Europ\xE9ens au ch\xF4mage depuis plus de six mois.",verified:!1},france24Legis:{url:"https://www.france24.com/fr/france/20240619-l%C3%A9gislatives-2024-ce-que-proposent-les-partis-sur-l-immigration-et-la-la%C3%AFcit%C3%A9",title:"L\xE9gislatives 2024 : ce que proposent les partis sur l'immigration et la la\xEFcit\xE9",publisher:"France 24",type:"press",date:"2024-06-19",quote:"Le camp pr\xE9sidentiel d\xE9fend la ligne de la loi de janvier 2024 : durcissement des conditions d'acc\xE8s aux prestations, ex\xE9cution renforc\xE9e des OQTF, maintien d'une immigration de travail encadr\xE9e.",verified:!1},senatConstit:{url:"https://www.senat.fr/travaux-parlementaires/textes-legislatifs/la-loi-en-clair/proposition-de-loi-constitutionnelle-relative-a-la-souverainete-de-la-france-a-la-nationalite-a-limmigration-et-a-lasile.html",title:"Proposition de loi constitutionnelle relative \xE0 la souverainet\xE9 de la France, \xE0 la nationalit\xE9, \xE0 l'immigration et \xE0 l'asile",publisher:"S\xE9nat",type:"law",date:"2023-05-25",quote:"Le texte r\xE9forme les conditions d'acc\xE8s \xE0 la nationalit\xE9 fran\xE7aise et \xE0 l'asile, et permet aux Fran\xE7ais de se prononcer par r\xE9f\xE9rendum sur la politique migratoire.",verified:!1}},ah={id:"immigration",title:{fr:"Immigration et nationalit\xE9",en:"Immigration and nationality"},intro:{fr:"L'immigration est le sujet o\xF9 les programmes de 2027 divergent le plus, et o\xF9 les propositions se heurtent le plus souvent \xE0 la Constitution et aux engagements europ\xE9ens de la France. Les six questions ci-dessous portent sur des dispositifs juridiques pr\xE9cis \u2014 droit du sol, r\xE9gularisation, AME, regroupement familial, conditions d'acc\xE8s aux prestations, voie constitutionnelle \u2014 et non sur un \xAB plus \xBB ou un \xAB moins \xBB d'immigration en g\xE9n\xE9ral.",en:`Immigration is where the 2027 platforms diverge most sharply, and where proposals most often run into the Constitution and France's European commitments. The six questions below concern specific legal mechanisms \u2014 birthright citizenship, regularisation, state medical aid, family reunification, benefit eligibility, and the constitutional route \u2014 rather than "more" or "less" immigration in the abstract.`},questions:[{id:"droit-du-sol",prompt:{fr:"Comment la nationalit\xE9 fran\xE7aise devrait-elle s'acqu\xE9rir pour une personne n\xE9e en France de parents \xE9trangers ?",en:"How should French nationality be acquired by someone born in France to foreign parents?"},context:{fr:"Aujourd'hui, un enfant n\xE9 en France de parents \xE9trangers devient fran\xE7ais \xE0 18 ans s'il y r\xE9side depuis au moins cinq ans depuis l'\xE2ge de 11 ans. La loi du 26 janvier 2024 a durci ce m\xE9canisme en exigeant une manifestation de volont\xE9 explicite entre 16 et 18 ans.",en:"Today, a child born in France to foreign parents becomes French at 18 if they have lived there at least five years since the age of 11. The law of 26 January 2024 tightened this by requiring an explicit application between 16 and 18."},options:[{id:"abolir",label:{fr:"Supprimer le droit du sol",en:"Abolish birthright citizenship"},detail:{fr:"Supprimer enti\xE8rement l'acquisition de la nationalit\xE9 par la naissance sur le sol fran\xE7ais. La nationalit\xE9 ne s'obtiendrait plus que par filiation ou par naturalisation, sur crit\xE8res de m\xE9rite et d'assimilation.",en:"Abolish acquisition of nationality by birth on French soil entirely. Nationality would be obtained only by descent or by naturalisation, on merit and assimilation criteria."}},{id:"restreindre",label:{fr:"Restreindre fortement",en:"Substantially restrict"},detail:{fr:"Conserver le droit du sol mais en durcir les conditions : demande explicite, dur\xE9e de r\xE9sidence allong\xE9e, condition de r\xE9gularit\xE9 du s\xE9jour des parents, et exclusion en cas de condamnation p\xE9nale.",en:"Keep birthright citizenship but tighten the conditions: explicit application, longer residence requirement, lawful residence of the parents, and exclusion in case of a criminal conviction."}},{id:"statu-quo",label:{fr:"Maintenir le cadre actuel",en:"Keep the current framework"},detail:{fr:"Conserver le droit du sol tel qu'issu de la loi de janvier 2024, avec la manifestation de volont\xE9 entre 16 et 18 ans, sans nouvelle restriction ni assouplissement.",en:"Keep birthright citizenship as amended by the January 2024 law, including the application requirement between 16 and 18, with no further restriction or easing."}},{id:"faciliter",label:{fr:"Revenir sur les restrictions",en:"Roll back the restrictions"},detail:{fr:"Abroger les durcissements de 2024 et r\xE9tablir l'acquisition automatique \xE0 la majorit\xE9, en simplifiant par ailleurs les proc\xE9dures de naturalisation.",en:"Repeal the 2024 tightening and restore automatic acquisition at 18, while also simplifying naturalisation procedures."}}],positions:[{partyId:"rn",stance:"maps_to_option",optionId:"abolir",partialMatch:[],summary:{fr:"Le RN propose la suppression pure et simple du droit du sol. L'acc\xE8s \xE0 la nationalit\xE9 serait r\xE9serv\xE9 \xE0 la naturalisation, accord\xE9e sur des crit\xE8res de m\xE9rite et d'assimilation. La mesure figure parmi les propositions n\xE9cessitant une r\xE9vision constitutionnelle ou un r\xE9f\xE9rendum.",en:"The RN proposes outright abolition of birthright citizenship. Access to nationality would be reserved for naturalisation, granted on merit and assimilation criteria. The measure is among those requiring a constitutional revision or a referendum."},sources:[_.rn22,_.rnReferendum],confidence:"high"},{partyId:"reconquete",stance:"maps_to_option",optionId:"abolir",partialMatch:[],summary:{fr:"Reconqu\xEAte d\xE9fend la suppression du droit du sol dans le cadre plus large d'une politique d'\xAB immigration z\xE9ro \xBB puis \xAB n\xE9gative \xBB. La nationalit\xE9 rel\xE8verait exclusivement de la filiation et d'une naturalisation tr\xE8s restrictive.",en:'Reconqu\xEAte supports abolishing birthright citizenship as part of a broader policy of "zero" and then "negative" immigration. Nationality would derive exclusively from descent and a highly restrictive naturalisation route.'},sources:[_.zemmourZero,_.zemmourRemigration],confidence:"medium"},{partyId:"lr",stance:"maps_to_option",optionId:"restreindre",partialMatch:[],summary:{fr:"LR a d\xE9pos\xE9 une proposition de loi restreignant le droit du sol sans le supprimer, assortie d'une proposition constitutionnelle r\xE9formant les conditions d'acc\xE8s \xE0 la nationalit\xE9. L'acquisition deviendrait conditionn\xE9e \xE0 une d\xE9marche volontaire et \xE0 des crit\xE8res d'assimilation inscrits dans la Constitution.",en:"LR tabled a bill restricting rather than abolishing birthright citizenship, alongside a constitutional bill reforming access to nationality. Acquisition would be conditioned on a voluntary application and on assimilation criteria written into the Constitution."},sources:[_.lrDeuxPPL,_.senatConstit],confidence:"high"},{partyId:"renaissance",stance:"maps_to_option",optionId:"statu-quo",partialMatch:[],summary:{fr:"Renaissance d\xE9fend le cadre issu de la loi du 26 janvier 2024, qu'elle a port\xE9e : maintien du droit du sol assorti de la manifestation de volont\xE9 entre 16 et 18 ans. Le parti n'a pas propos\xE9 de nouveau durcissement depuis.",en:"Renaissance defends the framework set by the 26 January 2024 law, which it sponsored: birthright citizenship retained, subject to an application between 16 and 18. The party has not proposed further tightening since."},sources:[_.loi2024,_.france24Legis],confidence:"medium"},{partyId:"horizons",stance:"no_stated_position",optionId:null,partialMatch:[],summary:{fr:"\xC9douard Philippe s'est exprim\xE9 en d\xE9tail sur l'immigration de travail et l'ex\xE9cution des OQTF, mais n'a pas formul\xE9 de position propre sur le droit du sol pour 2027. Aucune proposition distincte de celle du camp pr\xE9sidentiel n'est document\xE9e \xE0 ce stade.",en:"\xC9douard Philippe has spoken in detail about labour migration and enforcement of removal orders, but has set out no distinct position on birthright citizenship for 2027. No proposal separate from the presidential camp is documented at this stage."},sources:[],confidence:"low"},{partyId:"ps",stance:"maps_to_option",optionId:"faciliter",partialMatch:["statu-quo"],summary:{fr:"Le PS demande l'abrogation des dispositions restrictives des lois de 2018 et 2024, ce qui inclut le retour \xE0 l'acquisition automatique de la nationalit\xE9 \xE0 la majorit\xE9. Il d\xE9fend par ailleurs la carte de s\xE9jour de dix ans comme titre de droit commun.",en:"The PS calls for repeal of the restrictive provisions of the 2018 and 2024 laws, which includes restoring automatic acquisition of nationality at 18. It also advocates the ten-year residence permit as the standard permit."},sources:[_.lcpTourHorizon],confidence:"medium"},{partyId:"ecologistes",stance:"maps_to_option",optionId:"faciliter",partialMatch:[],summary:{fr:"Les \xC9cologistes s'associent \xE0 la demande d'abrogation des lois immigration de 2018 et 2023-2024 et au r\xE9tablissement de l'acquisition automatique de la nationalit\xE9. Ils d\xE9fendent une simplification g\xE9n\xE9rale des proc\xE9dures de naturalisation.",en:"The Ecologists join the call to repeal the 2018 and 2023-2024 immigration laws and to restore automatic acquisition of nationality. They advocate a general simplification of naturalisation procedures."},sources:[_.lcpTourHorizon,_.nfpInfomigrants],confidence:"medium"},{partyId:"lfi",stance:"maps_to_option",optionId:"faciliter",partialMatch:[],summary:{fr:"LFI demande l'abrogation des lois restrictives et le r\xE9tablissement du droit du sol dans sa forme automatique. Le parti y ajoute le droit de vote des \xE9trangers aux \xE9lections locales, qui suppose une r\xE9vision constitutionnelle.",en:"LFI calls for repeal of the restrictive laws and restoration of automatic birthright citizenship. It adds voting rights for foreign residents in local elections, which would require a constitutional revision."},sources:[_.lfiElysee,_.nfpInfomigrants],confidence:"medium"}]},{id:"regularisation",prompt:{fr:"Que faire des personnes sans titre de s\xE9jour qui travaillent en France ?",en:"What should happen to people working in France without a residence permit?"},context:{fr:"La loi du 26 janvier 2024 a cr\xE9\xE9 une r\xE9gularisation encadr\xE9e pour les travailleurs des m\xE9tiers en tension, laiss\xE9e \xE0 l'appr\xE9ciation du pr\xE9fet et sans droit automatique. La gauche demandait un droit opposable ; la droite s'opposait \xE0 toute r\xE9gularisation.",en:"The 26 January 2024 law created a restricted regularisation route for workers in shortage occupations, left to prefectural discretion with no automatic right. The left wanted an enforceable right; the right opposed any regularisation."},options:[{id:"aucune",label:{fr:"Aucune r\xE9gularisation",en:"No regularisation"},detail:{fr:"Exclure toute r\xE9gularisation et appliquer syst\xE9matiquement les mesures d'\xE9loignement, y compris pour les personnes en emploi. Sanctionner les employeurs.",en:"Rule out any regularisation and systematically enforce removal, including for people in work. Penalise employers."}},{id:"discretionnaire",label:{fr:"Cas par cas, \xE0 la main du pr\xE9fet",en:"Case by case, prefectural discretion"},detail:{fr:"Pas de droit \xE0 la r\xE9gularisation, mais une possibilit\xE9 laiss\xE9e \xE0 l'appr\xE9ciation de l'administration, strictement encadr\xE9e et r\xE9serv\xE9e \xE0 des situations exceptionnelles.",en:"No right to regularisation, but a possibility left to administrative discretion, tightly framed and reserved for exceptional cases."}},{id:"metiers-tension",label:{fr:"R\xE9gularisation par les m\xE9tiers en tension",en:"Regularisation via shortage occupations"},detail:{fr:"Cr\xE9er un titre de s\xE9jour pour les travailleurs des secteurs en p\xE9nurie de main-d'\u0153uvre, ind\xE9pendant de l'employeur, \xE9ventuellement contingent\xE9 par des quotas annuels.",en:"Create a residence permit for workers in labour-shortage sectors, independent of the employer, potentially capped by annual quotas."}},{id:"large",label:{fr:"R\xE9gularisation large",en:"Broad regularisation"},detail:{fr:"R\xE9gulariser l'ensemble des travailleurs sans papiers, ainsi que les parents d'enfants scolaris\xE9s et les \xE9tudiants, sans condition de secteur d'activit\xE9.",en:"Regularise all undocumented workers, along with parents of school-age children and students, with no sectoral condition."}}],positions:[{partyId:"rn",stance:"maps_to_option",optionId:"aucune",partialMatch:[],summary:{fr:"Le RN exclut toute r\xE9gularisation et pr\xE9voit l'expulsion syst\xE9matique des \xE9trangers en situation irr\xE9guli\xE8re. Le programme associe cette ligne \xE0 la fin de l'immigration de peuplement et au traitement des demandes d'asile hors du territoire fran\xE7ais.",en:"The RN rules out any regularisation and provides for systematic expulsion of those in an irregular situation. The platform ties this to ending settlement migration and processing asylum claims outside French territory."},sources:[_.rn22,_.rnSurligneurs],confidence:"high"},{partyId:"reconquete",stance:"maps_to_option",optionId:"aucune",partialMatch:[],summary:{fr:"Reconqu\xEAte va au-del\xE0 du refus de r\xE9gulariser : le parti propose un minist\xE8re de la \xAB remigration \xBB charg\xE9 d'organiser les d\xE9parts, visant notamment les \xE9trangers condamn\xE9s, les fich\xE9s S et les extra-Europ\xE9ens sans emploi depuis plus de six mois.",en:'Reconqu\xEAte goes beyond refusing regularisation: it proposes a "remigration" ministry to organise departures, targeting in particular convicted foreign nationals, those on security watchlists, and non-Europeans unemployed for over six months.'},sources:[_.zemmourRemigration,_.zemmourZero],confidence:"medium"},{partyId:"lr",stance:"maps_to_option",optionId:"discretionnaire",partialMatch:["aucune"],summary:{fr:"LR s'est oppos\xE9 \xE0 la cr\xE9ation d'un droit \xE0 la r\xE9gularisation par les m\xE9tiers en tension lors de l'examen de la loi de 2024, tout en acceptant une possibilit\xE9 discr\xE9tionnaire strictement encadr\xE9e. Le parti privil\xE9gie un pilotage par quotas vot\xE9s annuellement au Parlement.",en:"LR opposed creating a right to regularisation through shortage occupations during the 2024 law, while accepting a tightly framed discretionary possibility. It favours steering migration through quotas voted annually by Parliament."},sources:[_.compromisFranceinfo,_.lrConstit],confidence:"high"},{partyId:"renaissance",stance:"maps_to_option",optionId:"metiers-tension",partialMatch:["discretionnaire"],summary:{fr:"Renaissance a port\xE9 le compromis de 2024 : une r\xE9gularisation par les m\xE9tiers en tension, r\xE9elle mais laiss\xE9e \xE0 l'appr\xE9ciation du pr\xE9fet et sans droit automatique. Le parti d\xE9fend le maintien de ce dispositif plut\xF4t que son extension.",en:"Renaissance sponsored the 2024 compromise: a real regularisation route via shortage occupations, but left to prefectural discretion with no automatic right. The party defends keeping this mechanism rather than extending it."},sources:[_.compromisFranceinfo,_.france24Legis],confidence:"medium",divergenceNote:{fr:"Une partie des \xE9lus du camp pr\xE9sidentiel a vot\xE9 avec la gauche pour d\xE9fendre un dispositif plus large que la ligne officielle du parti.",en:"Some presidential-camp members voted with the left to defend a broader mechanism than the party's official line."}},{partyId:"horizons",stance:"maps_to_option",optionId:"metiers-tension",partialMatch:[],summary:{fr:"\xC9douard Philippe assume une immigration de travail au motif que la population active se contracte, et propose des quotas de r\xE9gularisation dans les m\xE9tiers en tension. Il associe cette ouverture \xE0 une restriction de l'immigration familiale.",en:"\xC9douard Philippe openly supports labour migration on the grounds that the working-age population is shrinking, and proposes regularisation quotas in shortage occupations. He pairs this opening with restrictions on family migration."},sources:[_.philippeProgramme,_.philippeQuotas],confidence:"medium"},{partyId:"ps",stance:"maps_to_option",optionId:"large",partialMatch:["metiers-tension"],summary:{fr:"Le PS a d\xE9fendu au Parlement la cr\xE9ation d'un titre de s\xE9jour pour les m\xE9tiers en tension, mais son programme va plus loin : r\xE9gularisation des travailleurs, des \xE9tudiants et des parents d'enfants scolaris\xE9s, et carte de dix ans comme titre de droit commun.",en:"The PS defended a shortage-occupation permit in Parliament, but its platform goes further: regularisation of workers, students and parents of school-age children, with the ten-year card as the standard permit."},sources:[_.metiersTension,_.lcpTourHorizon],confidence:"medium"},{partyId:"ecologistes",stance:"maps_to_option",optionId:"large",partialMatch:["metiers-tension"],summary:{fr:"Les \xC9cologistes ont soutenu la r\xE9gularisation par les m\xE9tiers en tension au Parlement tout en portant une r\xE9gularisation plus large dans leur programme, associ\xE9e \xE0 l'accueil inconditionnel des mineurs non accompagn\xE9s.",en:"The Ecologists backed shortage-occupation regularisation in Parliament while advocating broader regularisation in their platform, alongside unconditional reception of unaccompanied minors."},sources:[_.metiersTension,_.nfpInfomigrants],confidence:"medium"},{partyId:"lfi",stance:"maps_to_option",optionId:"large",partialMatch:[],summary:{fr:"LFI a explicitement rejet\xE9 l'approche par m\xE9tiers en tension, jug\xE9e \xAB utilitariste \xBB, et demande la r\xE9gularisation de tous les travailleurs sans papiers pr\xE9sents sur le territoire, sans condition de secteur. Le parti y ajoute la r\xE9gularisation des parents d'enfants scolaris\xE9s.",en:'LFI explicitly rejected the shortage-occupation approach as "utilitarian" and calls for regularising all undocumented workers present on the territory, with no sectoral condition. It adds regularisation of parents of school-age children.'},sources:[_.lfiRegul,_.lfiElysee],confidence:"high"}]},{id:"ame",prompt:{fr:"Quel acc\xE8s aux soins pour les personnes \xE9trang\xE8res en situation irr\xE9guli\xE8re ?",en:"What healthcare access should irregular migrants have?"},context:{fr:"L'aide m\xE9dicale d'\xC9tat (AME) couvre les soins des personnes sans titre de s\xE9jour r\xE9sidant en France depuis plus de trois mois, sous condition de ressources. Sa suppression ou sa transformation en aide m\xE9dicale d'urgence (AMU) revient dans le d\xE9bat \xE0 chaque texte sur l'immigration.",en:"State medical aid (AME) covers healthcare for undocumented people resident in France for over three months, subject to a means test. Abolishing it or converting it into emergency-only aid (AMU) returns in every immigration debate."},options:[{id:"supprimer",label:{fr:"Supprimer l'AME",en:"Abolish the AME"},detail:{fr:"Supprimer le dispositif, ne laissant subsister que les soins d\xE9livr\xE9s en situation d'urgence vitale au titre du droit commun hospitalier.",en:"Abolish the scheme, leaving only life-threatening emergency care under ordinary hospital rules."}},{id:"amu",label:{fr:"Transformer en aide m\xE9dicale d'urgence",en:"Convert to emergency medical aid"},detail:{fr:"Remplacer l'AME par une AMU au panier de soins nettement restreint, limit\xE9 aux urgences, aux maladies graves et transmissibles et \xE0 la maternit\xE9.",en:"Replace the AME with an emergency scheme covering a much narrower basket: emergencies, serious and communicable diseases, and maternity care."}},{id:"maintenir-controler",label:{fr:"Maintenir avec contr\xF4les renforc\xE9s",en:"Keep with tighter controls"},detail:{fr:"Conserver l'AME dans son p\xE9rim\xE8tre actuel en renfor\xE7ant les contr\xF4les anti-fraude et les conditions de r\xE9sidence, sans r\xE9duire le panier de soins.",en:"Keep the AME at its current scope while strengthening anti-fraud checks and residence conditions, without reducing the basket of care."}},{id:"maintenir-etendre",label:{fr:"Maintenir et faciliter",en:"Keep and widen access"},detail:{fr:"Conserver l'AME et lever les obstacles d'acc\xE8s, en simplifiant les d\xE9marches et en supprimant les conditions ajout\xE9es par les textes r\xE9cents.",en:"Keep the AME and remove barriers to access, simplifying procedures and dropping conditions added by recent legislation."}}],positions:[{partyId:"rn",stance:"maps_to_option",optionId:"supprimer",partialMatch:[],summary:{fr:"Le RN propose la suppression de l'AME, pr\xE9sent\xE9e comme un volet de la priorit\xE9 nationale dans l'acc\xE8s aux prestations. Le programme ne pr\xE9voit pas de dispositif de remplacement au-del\xE0 du droit commun de l'urgence hospitali\xE8re.",en:"The RN proposes abolishing the AME, presented as part of national preference in access to benefits. The platform provides no replacement scheme beyond ordinary emergency hospital care."},sources:[_.rnSurligneurs,_.rn22],confidence:"high"},{partyId:"reconquete",stance:"maps_to_option",optionId:"supprimer",partialMatch:[],summary:{fr:"Reconqu\xEAte d\xE9fend la suppression de l'AME dans le cadre de sa politique d'immigration z\xE9ro et de restriction g\xE9n\xE9rale de l'acc\xE8s des \xE9trangers aux prestations sociales.",en:"Reconqu\xEAte supports abolishing the AME as part of its zero-immigration policy and general restriction of foreign nationals' access to social benefits."},sources:[_.zemmourZero],confidence:"low"},{partyId:"lr",stance:"maps_to_option",optionId:"amu",partialMatch:["supprimer"],summary:{fr:"LR porte de longue date la transformation de l'AME en aide m\xE9dicale d'urgence au panier de soins restreint. Le S\xE9nat, \xE0 majorit\xE9 de droite, a vot\xE9 cette transformation lors de l'examen de la loi de 2024 avant que l'Assembl\xE9e ne r\xE9tablisse le dispositif.",en:"LR has long advocated converting the AME into an emergency scheme with a narrower basket of care. The right-leaning Senate voted this change during the 2024 law before the National Assembly restored the existing scheme."},sources:[_.lrDeuxPPL,_.metiersTension],confidence:"medium"},{partyId:"renaissance",stance:"maps_to_option",optionId:"maintenir-controler",partialMatch:[],summary:{fr:"Renaissance a d\xE9fendu le maintien de l'AME lors de l'examen de la loi de 2024, l'Assembl\xE9e ayant r\xE9tabli l'article supprim\xE9 par le S\xE9nat. Le parti accompagne ce maintien d'un discours sur le renforcement des contr\xF4les.",en:"Renaissance defended keeping the AME during the 2024 law, with the National Assembly restoring the article the Senate had deleted. The party pairs this with an emphasis on tighter controls."},sources:[_.metiersTension,_.france24Legis],confidence:"medium"},{partyId:"horizons",stance:"no_stated_position",optionId:null,partialMatch:[],summary:{fr:"Aucune position propre d'Horizons sur l'avenir de l'AME n'est document\xE9e pour 2027, distincte de celle du camp pr\xE9sidentiel. Les prises de parole d'\xC9douard Philippe sur l'immigration portent sur le travail, l'immigration familiale et les OQTF.",en:"No Horizons position on the future of the AME is documented for 2027 distinct from the presidential camp's. \xC9douard Philippe's public statements on immigration concern work, family migration and removal orders."},sources:[],confidence:"low"},{partyId:"ps",stance:"maps_to_option",optionId:"maintenir-etendre",partialMatch:["maintenir-controler"],summary:{fr:"Le PS a d\xE9fendu au Parlement le r\xE9tablissement de l'AME apr\xE8s sa suppression par le S\xE9nat, et demande plus largement l'abrogation des dispositions restrictives des lois r\xE9centes en mati\xE8re d'acc\xE8s aux droits sociaux.",en:"The PS defended restoring the AME in Parliament after the Senate deleted it, and more broadly calls for repealing the restrictive provisions of recent laws on access to social rights."},sources:[_.metiersTension,_.lcpTourHorizon],confidence:"medium"},{partyId:"ecologistes",stance:"maps_to_option",optionId:"maintenir-etendre",partialMatch:["maintenir-controler"],summary:{fr:"Les \xC9cologistes ont vot\xE9 le r\xE9tablissement de l'AME et portent une politique d'acc\xE8s aux soins sans condition de statut, en coh\xE9rence avec leur demande d'abrogation des lois immigration r\xE9centes.",en:"The Ecologists voted to restore the AME and advocate healthcare access regardless of immigration status, consistent with their call to repeal recent immigration laws."},sources:[_.metiersTension,_.nfpInfomigrants],confidence:"medium"},{partyId:"lfi",stance:"maps_to_option",optionId:"maintenir-etendre",partialMatch:[],summary:{fr:"LFI d\xE9fend le maintien de l'AME et sa simplification, dans le cadre plus large d'une abrogation des lois restrictives et d'un acc\xE8s inconditionnel aux soins. Le parti conteste le principe m\xEAme d'un r\xE9gime distinct du droit commun.",en:"LFI supports keeping and simplifying the AME, within a broader repeal of restrictive laws and unconditional healthcare access. The party contests the very principle of a scheme separate from ordinary coverage."},sources:[_.lfiElysee,_.nfpInfomigrants],confidence:"medium"}]},{id:"regroupement-familial",prompt:{fr:"Faut-il maintenir le droit de faire venir sa famille en France ?",en:"Should the right to bring one's family to France be maintained?"},context:{fr:"Le regroupement familial permet \xE0 un \xE9tranger r\xE9sidant r\xE9guli\xE8rement en France depuis au moins dix-huit mois de faire venir son conjoint et ses enfants mineurs, sous conditions de ressources et de logement. Ces conditions ont \xE9t\xE9 durcies par la loi de janvier 2024.",en:"Family reunification allows a foreign national lawfully resident for at least eighteen months to bring their spouse and minor children, subject to income and housing conditions. These were tightened by the January 2024 law."},options:[{id:"supprimer-rf",label:{fr:"Supprimer le regroupement familial",en:"Abolish family reunification"},detail:{fr:"Mettre fin au dispositif, ce qui suppose de se d\xE9gager des engagements europ\xE9ens et conventionnels prot\xE9geant le droit \xE0 la vie familiale.",en:"End the scheme, which would require departing from European and treaty commitments protecting the right to family life."}},{id:"durcir-fort",label:{fr:"Durcir fortement les conditions",en:"Sharply tighten the conditions"},detail:{fr:"Conserver le droit mais allonger la dur\xE9e de r\xE9sidence pr\xE9alable et relever les exigences de ressources, de logement et de ma\xEEtrise du fran\xE7ais.",en:"Keep the right but lengthen the prior residence requirement and raise the income, housing and French-language thresholds."}},{id:"durcir-modere",label:{fr:"Maintenir le cadre de 2024",en:"Keep the 2024 framework"},detail:{fr:"Conserver le dispositif tel que durci par la loi de janvier 2024, sans nouvelle restriction ni retour en arri\xE8re.",en:"Keep the scheme as tightened by the January 2024 law, with no further restriction and no rollback."}},{id:"assouplir",label:{fr:"Revenir sur les durcissements",en:"Roll back the tightening"},detail:{fr:"Abroger les conditions ajout\xE9es en 2024 et faciliter l'exercice effectif du droit \xE0 la vie familiale.",en:"Repeal the conditions added in 2024 and make the right to family life easier to exercise in practice."}}],positions:[{partyId:"rn",stance:"maps_to_option",optionId:"supprimer-rf",partialMatch:[],summary:{fr:"Le RN pr\xE9voit la fin du regroupement familial, pr\xE9sent\xE9e avec la suppression du droit du sol comme un moyen de mettre fin \xE0 l'immigration de peuplement. La mesure se heurte au droit europ\xE9en, ce que le parti entend surmonter par r\xE9f\xE9rendum.",en:"The RN plans to end family reunification, presented alongside abolishing birthright citizenship as a way to stop settlement migration. The measure conflicts with European law, which the party intends to overcome by referendum."},sources:[_.rnSurligneurs,_.rnReferendum],confidence:"high"},{partyId:"reconquete",stance:"maps_to_option",optionId:"supprimer-rf",partialMatch:[],summary:{fr:"Reconqu\xEAte inscrit la suppression du regroupement familial dans son objectif d'immigration z\xE9ro puis n\xE9gative, avec un dispositif d'organisation des d\xE9parts confi\xE9 \xE0 un minist\xE8re d\xE9di\xE9.",en:"Reconqu\xEAte includes abolishing family reunification within its zero-then-negative immigration objective, with departures organised by a dedicated ministry."},sources:[_.zemmourZero,_.zemmourRemigration],confidence:"medium"},{partyId:"lr",stance:"maps_to_option",optionId:"durcir-fort",partialMatch:["supprimer-rf"],summary:{fr:"LR propose de durcir substantiellement les conditions du regroupement familial plut\xF4t que de le supprimer, dans le cadre d'un pilotage g\xE9n\xE9ral de l'immigration par quotas vot\xE9s au Parlement, hors asile et ressortissants europ\xE9ens.",en:"LR proposes substantially tightening family reunification rather than abolishing it, within a general steering of immigration through parliamentary quotas, excluding asylum and EU nationals."},sources:[_.lrConstit,_.lrDeuxPPL],confidence:"medium"},{partyId:"renaissance",stance:"maps_to_option",optionId:"durcir-modere",partialMatch:[],summary:{fr:"Renaissance d\xE9fend les conditions issues de la loi de janvier 2024, qui a relev\xE9 les exigences de ressources, de logement et de dur\xE9e de s\xE9jour pr\xE9alable, sans remettre en cause le principe du droit.",en:"Renaissance defends the conditions set by the January 2024 law, which raised income, housing and prior-residence requirements without challenging the principle of the right."},sources:[_.loi2024,_.france24Legis],confidence:"medium"},{partyId:"horizons",stance:"maps_to_option",optionId:"durcir-fort",partialMatch:["durcir-modere"],summary:{fr:"\xC9douard Philippe propose explicitement de limiter l'immigration familiale et d'en durcir les conditions d'acc\xE8s, en contrepartie d'une immigration de travail assum\xE9e. C'est le pivot de sa doctrine migratoire.",en:"\xC9douard Philippe explicitly proposes limiting family migration and tightening its conditions, in exchange for openly accepted labour migration. This trade-off is the pivot of his migration doctrine."},sources:[_.philippeProgramme],confidence:"medium"},{partyId:"ps",stance:"maps_to_option",optionId:"assouplir",partialMatch:[],summary:{fr:"Le PS demande l'abrogation des dispositions restrictives des lois de 2018 et 2024, ce qui inclut les conditions ajout\xE9es au regroupement familial. Il d\xE9fend la carte de dix ans comme titre de droit commun, qui en faciliterait l'exercice.",en:"The PS calls for repealing the restrictive provisions of the 2018 and 2024 laws, including the added family-reunification conditions. It advocates the ten-year card as the standard permit, which would ease its exercise."},sources:[_.lcpTourHorizon],confidence:"medium"},{partyId:"ecologistes",stance:"maps_to_option",optionId:"assouplir",partialMatch:[],summary:{fr:"Les \xC9cologistes portent l'abrogation des lois immigration r\xE9centes et une politique d'accueil davantage fond\xE9e sur l'accompagnement que sur la r\xE9pression, ce qui inclut le retour sur les durcissements du regroupement familial.",en:"The Ecologists advocate repealing recent immigration laws and a reception policy based on support rather than enforcement, including rolling back the family-reunification tightening."},sources:[_.nfpInfomigrants,_.lcpTourHorizon],confidence:"medium"},{partyId:"lfi",stance:"maps_to_option",optionId:"assouplir",partialMatch:[],summary:{fr:"LFI demande l'abrogation des lois restrictives et d\xE9fend le droit \xE0 la vie familiale sans conditions de ressources renforc\xE9es. Le parti y associe l'accueil inconditionnel des mineurs non accompagn\xE9s.",en:"LFI calls for repealing the restrictive laws and defends the right to family life without heightened income conditions. It pairs this with unconditional reception of unaccompanied minors."},sources:[_.nfpInfomigrants,_.lfiElysee],confidence:"medium"}]},{id:"prestations-sociales",prompt:{fr:"Les \xE9trangers en situation r\xE9guli\xE8re doivent-ils avoir les m\xEAmes droits sociaux que les Fran\xE7ais ?",en:"Should lawfully resident foreign nationals have the same social rights as French citizens?"},context:{fr:"La loi du 26 janvier 2024 a allong\xE9 les dur\xE9es de r\xE9sidence exig\xE9es pour acc\xE9der \xE0 certaines prestations non contributives. La \xAB priorit\xE9 nationale \xBB, qui r\xE9serverait ces prestations aux Fran\xE7ais, se heurte au principe constitutionnel d'\xE9galit\xE9.",en:'The 26 January 2024 law lengthened the residence periods required for certain non-contributory benefits. "National preference", which would reserve them for French citizens, conflicts with the constitutional principle of equality.'},options:[{id:"priorite-nationale",label:{fr:"Priorit\xE9 nationale",en:"National preference"},detail:{fr:"R\xE9server les aides sociales, le logement social et l'acc\xE8s \xE0 l'emploi aux citoyens fran\xE7ais, ce qui suppose une r\xE9vision de la Constitution ou un r\xE9f\xE9rendum.",en:"Reserve social aid, social housing and job access for French citizens, which would require a constitutional revision or a referendum."}},{id:"delais-allonges",label:{fr:"Allonger les d\xE9lais de r\xE9sidence",en:"Lengthen residence requirements"},detail:{fr:"Maintenir l'\xE9galit\xE9 de principe mais conditionner les prestations non contributives \xE0 une dur\xE9e de r\xE9sidence ou de travail nettement plus longue.",en:"Maintain formal equality but condition non-contributory benefits on a substantially longer period of residence or employment."}},{id:"cadre-2024",label:{fr:"Maintenir le cadre de 2024",en:"Keep the 2024 framework"},detail:{fr:"Conserver les conditions de dur\xE9e introduites en janvier 2024, en renfor\xE7ant la lutte contre la fraude sans nouvelle restriction.",en:"Keep the duration conditions introduced in January 2024, strengthening anti-fraud enforcement without further restriction."}},{id:"egalite",label:{fr:"\xC9galit\xE9 des droits sociaux",en:"Equal social rights"},detail:{fr:"Abroger les conditions de dur\xE9e introduites r\xE9cemment et garantir l'\xE9galit\xE9 d'acc\xE8s aux prestations pour toute personne en situation r\xE9guli\xE8re.",en:"Repeal the recently introduced duration conditions and guarantee equal access to benefits for everyone lawfully resident."}}],positions:[{partyId:"rn",stance:"maps_to_option",optionId:"priorite-nationale",partialMatch:[],summary:{fr:"La priorit\xE9 nationale est au c\u0153ur du programme du RN : r\xE9servation des aides sociales aux Fran\xE7ais et pr\xE9f\xE9rence nationale pour le logement social et l'acc\xE8s \xE0 l'emploi. Le parti reconna\xEEt que la mesure exige de passer par un r\xE9f\xE9rendum.",en:"National preference is central to the RN platform: social aid reserved for French citizens and national preference for social housing and job access. The party accepts the measure requires going through a referendum."},sources:[_.rn22,_.rnSurligneurs,_.rnReferendum],confidence:"high"},{partyId:"reconquete",stance:"maps_to_option",optionId:"priorite-nationale",partialMatch:[],summary:{fr:"Reconqu\xEAte d\xE9fend la priorit\xE9 nationale dans l'acc\xE8s aux prestations et au logement, en coh\xE9rence avec son objectif d'immigration n\xE9gative. Le parti lie explicitement l'acc\xE8s aux droits sociaux \xE0 la nationalit\xE9.",en:"Reconqu\xEAte supports national preference in access to benefits and housing, consistent with its negative-immigration objective. The party explicitly ties access to social rights to nationality."},sources:[_.zemmourZero,_.zemmourRemigration],confidence:"low"},{partyId:"lr",stance:"maps_to_option",optionId:"delais-allonges",partialMatch:["priorite-nationale"],summary:{fr:"LR a obtenu dans la loi de 2024 l'allongement des dur\xE9es de r\xE9sidence conditionnant l'acc\xE8s aux prestations non contributives, et propose de constitutionnaliser la possibilit\xE9 de traiter diff\xE9remment nationaux et \xE9trangers sur ce terrain.",en:"LR secured longer residence requirements for non-contributory benefits in the 2024 law, and proposes constitutionalising the possibility of treating nationals and foreigners differently in this area."},sources:[_.lrConstit,_.senatConstit],confidence:"medium"},{partyId:"renaissance",stance:"maps_to_option",optionId:"cadre-2024",partialMatch:[],summary:{fr:"Renaissance d\xE9fend la ligne de la loi de janvier 2024 : durcissement des conditions de dur\xE9e pour l'acc\xE8s aux prestations, assorti du maintien du principe d'\xE9galit\xE9 et d'un effort sur la lutte contre la fraude.",en:"Renaissance defends the January 2024 line: tighter duration conditions for benefit access, while maintaining the principle of equality and emphasising anti-fraud enforcement."},sources:[_.france24Legis,_.loi2024],confidence:"medium"},{partyId:"horizons",stance:"no_stated_position",optionId:null,partialMatch:[],summary:{fr:"Horizons n'a pas formul\xE9 pour 2027 de position distincte sur les conditions d'acc\xE8s des \xE9trangers aux prestations sociales. Les propositions d'\xC9douard Philippe portent sur le travail, l'immigration familiale et l'ex\xE9cution des OQTF.",en:"Horizons has set out no distinct 2027 position on foreign nationals' access to social benefits. \xC9douard Philippe's proposals concern work, family migration and enforcement of removal orders."},sources:[],confidence:"low"},{partyId:"ps",stance:"maps_to_option",optionId:"egalite",partialMatch:[],summary:{fr:"Le PS demande l'abrogation des dispositions restrictives des lois de 2018 et 2024, dont les conditions de dur\xE9e conditionnant l'acc\xE8s aux prestations, et d\xE9fend l'\xE9galit\xE9 d'acc\xE8s pour les personnes en situation r\xE9guli\xE8re.",en:"The PS calls for repealing the restrictive provisions of the 2018 and 2024 laws, including benefit duration conditions, and defends equal access for lawfully resident people."},sources:[_.lcpTourHorizon],confidence:"medium"},{partyId:"ecologistes",stance:"maps_to_option",optionId:"egalite",partialMatch:[],summary:{fr:"Les \xC9cologistes s'opposent \xE0 toute diff\xE9renciation des droits sociaux fond\xE9e sur la nationalit\xE9 et demandent l'abrogation des conditions de dur\xE9e introduites par les textes r\xE9cents.",en:"The Ecologists oppose any differentiation of social rights based on nationality and call for repealing the duration conditions introduced by recent legislation."},sources:[_.lcpTourHorizon,_.nfpInfomigrants],confidence:"medium"},{partyId:"lfi",stance:"maps_to_option",optionId:"egalite",partialMatch:[],summary:{fr:"LFI conteste frontalement le principe de la 9f\xE9rendaire.",en:"Revise the Constitution through Parliament to enshrine annually voted quotas, the principle of assimilation, and an extended referendum scope."}},{id:"cadre-existant",label:{fr:"Agir dans le cadre existant",en:"Act within the existing framework"},detail:{fr:"Ne pas modifier la Constitution et conduire la politique migratoire par la loi ordinaire et la coop\xE9ration europ\xE9enne, notamment le Pacte sur la migration et l'asile.",en:"Leave the Constitution unchanged and run migration policy through ordinary legislation and European cooperation, notably the Pact on Migration and Asylum."}},{id:"abroger",label:{fr:"Abroger les lois restrictives",en:"Repeal the restrictive laws"},detail:{fr:"Ne pas toucher \xE0 la Constitution et abroger par la loi ordinaire les dispositions restrictives adopt\xE9es depuis 2018.",en:"Leave the Constitution untouched and repeal, through ordinary legislation, the restrictive provisions adopted since 2018."}}],positions:[{partyId:"rn",stance:"maps_to_option",optionId:"referendum",partialMatch:["revision-constit"],summary:{fr:"Le RN fait du r\xE9f\xE9rendum sur l'immigration la cl\xE9 de vo\xFBte de son programme : il permettrait selon lui d'imposer la priorit\xE9 nationale et la suppression du droit du sol malgr\xE9 les obstacles constitutionnels. Le recours \xE0 l'article 11 pour cet objet est juridiquement contest\xE9.",en:"The RN makes a referendum on immigration the keystone of its platform: it would, in its view, impose national preference and abolish birthright citizenship despite constitutional obstacles. Using Article 11 for this purpose is legally contested."},sources:[_.rnReferendum,_.rn22],confidence:"high"},{partyId:"reconquete",stance:"maps_to_option",optionId:"referendum",partialMatch:["revision-constit"],summary:{fr:"Reconqu\xEAte soutient \xE9galement la voie r\xE9f\xE9rendaire pour imposer ses mesures migratoires, y compris la remigration, en assumant une rupture avec les engagements europ\xE9ens et conventionnels de la France.",en:"Reconqu\xEAte likewise backs the referendum route to impose its migration measures, including remigration, openly accepting a break with France's European and treaty commitments."},sources:[_.zemmourRemigration],confidence:"low"},{partyId:"lr",stance:"maps_to_option",optionId:"revision-constit",partialMatch:["referendum"],summary:{fr:"LR a d\xE9pos\xE9 le 25 mai 2023 une proposition de loi constitutionnelle donnant au Parlement le pouvoir de fixer chaque ann\xE9e des quotas par cat\xE9gorie, inscrivant le principe d'assimilation et \xE9tendant l'article 11 au r\xE9f\xE9rendum sur l'immigration.",en:"On 25 May 2023 LR tabled a constitutional bill giving Parliament the power to set annual quotas by category, enshrining the principle of assimilation and extending Article 11 to referendums on immigration."},sources:[_.lrConstit,_.senatConstit],confidence:"high"},{partyId:"renaissance",stance:"maps_to_option",optionId:"cadre-existant",partialMatch:[],summary:{fr:"Renaissance r\xE9cuse la voie constitutionnelle et r\xE9f\xE9rendaire et d\xE9fend une action par la loi ordinaire, dans le cadre du droit europ\xE9en et du Pacte sur la migration et l'asile. La loi de janvier 2024 illustre cette m\xE9thode.",en:"Renaissance rejects the constitutional and referendum routes, favouring ordinary legislation within European law and the Pact on Migration and Asylum. The January 2024 law exemplifies this method."},sources:[_.france24Legis,_.loi2024],confidence:"medium"},{partyId:"horizons",stance:"maps_to_option",optionId:"cadre-existant",partialMatch:[],summary:{fr:"\xC9douard Philippe inscrit ses propositions dans le cadre juridique existant, en insistant sur l'ex\xE9cution effective des OQTF et sur la normalisation des relations diplomatiques, notamment avec l'Alg\xE9rie, pour lever les blocages aux \xE9loignements.",en:"\xC9douard Philippe frames his proposals within the existing legal framework, stressing effective enforcement of removal orders and normalising diplomatic relations, notably with Algeria, to unblock removals."},sources:[_.philippeProgramme],confidence:"medium"},{partyId:"ps",stance:"maps_to_option",optionId:"abroger",partialMatch:[],summary:{fr:"Le PS ne propose aucune r\xE9vision constitutionnelle et demande l'abrogation par la loi ordinaire des dispositions restrictives des textes de 2018 et 2023-2024, avec la carte de dix ans comme titre de droit commun.",en:"The PS proposes no constitutional revision and calls for repealing, through ordinary legislation, the restrictive provisions of the 2018 and 2023-2024 texts, with the ten-year card as the standard permit."},sources:[_.lcpTourHorizon],confidence:"medium"},{partyId:"ecologistes",stance:"maps_to_option",optionId:"abroger",partialMatch:[],summary:{fr:"Les \xC9cologistes demandent l'abrogation des lois immigration r\xE9centes par la voie l\xE9gislative ordinaire et s'opposent \xE0 toute constitutionnalisation de restrictions migratoires.",en:"The Ecologists call for repealing recent immigration laws through ordinary legislation and oppose writing any migration restrictions into the Constitution."},sources:[_.lcpTourHorizon,_.nfpInfomigrants],confidence:"medium"},{partyId:"lfi",stance:"maps_to_option",optionId:"abroger",partialMatch:[],summary:{fr:"LFI demande l'abrogation des lois restrictives par la loi ordinaire. Le parti porte en revanche une r\xE9vision constitutionnelle d'un autre ordre, pour instaurer le droit de vote des \xE9trangers aux \xE9lections locales.",en:"LFI calls for repealing the restrictive laws through ordinary legislation. It does however advocate a constitutional revision of a different kind, to establish voting rights for foreign residents in local elections."},sources:[_.lfiElysee,_.nfpInfomigrants],confidence:"medium"}]}]};var M0={status:"draft_unverified",version:"2026.08.17-slice1",updatedAt:"2026-08-17",parties:th,topics:[ah]},Wt=eh.parse(M0),Fo=new Map(Wt.parties.map(e=>[e.id,e]));var xl={fr:{siteName:"Frelectio
